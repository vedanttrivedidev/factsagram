<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14110f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>FactScroll</title>
<style>
:root{--ink:#14110f}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--ink);overflow:hidden;font-family:"Helvetica Neue",Arial,sans-serif;color:var(--ink)}
#app{position:relative;max-width:480px;height:100dvh;margin:0 auto;overflow:hidden}
#feed{height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none}
#feed::-webkit-scrollbar{display:none}
.card{position:relative;height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;display:flex;flex-direction:column;justify-content:center;padding:110px 84px 120px 26px;overflow:hidden;user-select:none}
.deco{position:absolute;left:-18px;bottom:-40px;font-size:230px;line-height:1;opacity:.9;transform:rotate(-8deg);pointer-events:none}
.cat{align-self:flex-start;font-size:15px;font-weight:700;border:2px solid var(--ink);border-radius:99px;padding:5px 14px;margin-bottom:22px}
.fact{font-size:clamp(27px,7.6vw,38px);font-weight:900;line-height:1.1;letter-spacing:-.025em;text-wrap:pretty}
.rail{position:absolute;right:14px;bottom:calc(130px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:20px;align-items:center}
.rail button{width:54px;height:54px;border-radius:50%;border:2px solid var(--ink);background:transparent;color:var(--ink);font:800 22px/1 inherit;display:grid;place-items:center;cursor:pointer;transition:transform .15s}
.rail button:active{transform:scale(.88)}
.rail button.on{background:var(--ink);color:#fff}
.rail small{display:block;font:700 11px/1 inherit;margin-top:-14px;text-align:center}
.top{position:absolute;z-index:5;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) 18px 0;color:var(--ink);pointer-events:none}
.top>*{pointer-events:auto}
.tabs{display:flex;gap:6px;background:#14110f1f;border-radius:99px;padding:4px}
.tabs button{border:0;background:none;font:700 14px inherit;padding:7px 16px;border-radius:99px;color:var(--ink);cursor:pointer}
.tabs button[aria-selected=true]{background:var(--ink);color:#fff}
#count{font-weight:800;font-size:14px}
.burst{position:absolute;font-size:120px;pointer-events:none;animation:pop .7s ease-out forwards}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.3);opacity:1}60%{transform:translate(-50%,-50%) scale(1.15);opacity:1}100%{transform:translate(-50%,-70%) scale(1.2);opacity:0}}
.hint{position:absolute;left:0;right:0;bottom:calc(28px + env(safe-area-inset-bottom));text-align:center;font-weight:700;font-size:14px;pointer-events:none;animation:bob 1.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.empty{display:grid;place-items:center;height:100dvh;padding:40px;text-align:center;font-weight:800;font-size:24px;background:#f4c95d}
@media (prefers-reduced-motion:reduce){.hint{animation:none}.burst{animation-duration:.01s}}

.top{flex-direction:column;align-items:flex-start;gap:8px}
.card{padding-top:140px}
.tools{display:flex;gap:8px;align-items:center}
.tools button{border:2px solid var(--ink);background:transparent;color:var(--ink);font:700 13px inherit;padding:5px 12px;border-radius:99px;cursor:pointer}
#sheet{position:absolute;inset:0;z-index:20;background:#14110fb3;display:flex;align-items:flex-end}
#sheet[hidden]{display:none}
.panel{position:relative;width:100%;max-height:88%;overflow:auto;background:#fff4dc;border-radius:22px 22px 0 0;padding:24px 20px calc(24px + env(safe-area-inset-bottom))}
.panel h2{font-size:24px;font-weight:900;letter-spacing:-.02em;padding-right:40px}
.panel p{margin:6px 0 14px;font-size:14px}
.panel .x{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;border:2px solid var(--ink);background:none;font-size:16px;font-weight:800;cursor:pointer}
#chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
#chips button{border:2px solid var(--ink);background:transparent;border-radius:99px;padding:8px 14px;font:700 14px inherit;cursor:pointer}
#chips button.on{background:var(--ink);color:#fff}
.panel textarea,.panel input[type=text]{width:100%;border:2px solid var(--ink);border-radius:12px;padding:10px;font:500 15px inherit;background:#fff;margin-bottom:10px}
.panel .row{display:flex;gap:10px;justify-content:flex-end;margin-top:8px}
.panel .row button{border:2px solid var(--ink);border-radius:99px;padding:10px 18px;font:800 14px inherit;cursor:pointer;background:transparent}
.panel .row .go{background:var(--ink);color:#fff}
#addMsg{font-weight:700;font-size:14px;margin-top:8px}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div class="tabs" role="tablist"><button role="tab" aria-selected="true" data-tab="all">For you</button><button role="tab" aria-selected="false" data-tab="saved">Saved</button></div>
    <div class="tools"><button id="bTopics">Topics</button><button id="bAdd">+ Fact</button><span id="count"></span></div>
  </div>
  <div id="feed" tabindex="0"></div>
  <div class="hint" id="hint">Swipe up for the next fact</div>
</div>
<div id="sheet" hidden><div class="panel">
<button class="x" id="close" aria-label="Close">✕</button>
<section id="sTopics"><h2>Pick your topics</h2><p>You'll see more of these, plus the odd surprise. Skip this to see everything.</p><div id="chips"></div>
<div class="row"><button id="topicsClear">Clear</button><button class="go" id="topicsSave">Show my feed</button></div></section>
<section id="sAdd" hidden><h2>Add your own facts</h2><p>One per line. They appear only in your feed, on this device.</p>
<textarea id="newFacts" rows="5" maxlength="3000" placeholder="Octopuses have three hearts."></textarea>
<input type="text" id="newCat" maxlength="24" placeholder="Topic (optional, default: Mine)">
<input type="file" id="file" accept=".json,.txt"><div id="addMsg"></div>
<div class="row"><button id="clearMine">Remove mine</button><button class="go" id="addSave">Add</button></div></section>
</div></div>
<script>const BASE=[{"category": "Space", "fact": "A day on Venus is longer than its year. It spins once every ~243 Earth days but circles the Sun in ~225."}, {"category": "Space", "fact": "Sunlight takes about 8 minutes and 20 seconds to reach Earth. You're always seeing the Sun as it was a little while ago."}, {"category": "Space", "fact": "Saturn is so low in density that, in a big enough bathtub, it would float."}, {"category": "Space", "fact": "Olympus Mons on Mars is about 22 km tall, roughly two and a half times the height of Mount Everest."}, {"category": "Space", "fact": "A teaspoon of neutron-star material would weigh billions of tons."}, {"category": "Space", "fact": "Astronaut footprints on the Moon could last millions of years, because there's no wind or water to erase them."}, {"category": "Nature", "fact": "Botanically, bananas are berries. Strawberries are not."}, {"category": "Nature", "fact": "Cashews grow attached to the bottom of a fruit called the cashew apple."}, {"category": "Nature", "fact": "Sharks are older than trees. Sharks date back roughly 450 million years; the first trees came about 100 million years later."}, {"category": "Nature", "fact": "Lightning can heat the air around it to about 30,000 K, roughly five times hotter than the surface of the Sun."}, {"category": "Nature", "fact": "Antarctica is technically a desert, because it gets very little precipitation."}, {"category": "Nature", "fact": "Lake Baikal in Russia holds around 20% of the world's unfrozen surface fresh water."}, {"category": "Animals", "fact": "Octopuses have three hearts and blue blood."}, {"category": "Animals", "fact": "Wombats produce cube-shaped poop."}, {"category": "Animals", "fact": "Sea otters sometimes hold paws while sleeping so they don't drift apart."}, {"category": "Animals", "fact": "A group of flamingos is called a flamboyance."}, {"category": "Animals", "fact": "Crows can recognize individual human faces and remember them for years."}, {"category": "Animals", "fact": "Tardigrades have survived exposure to the vacuum of space in experiments."}, {"category": "Animals", "fact": "Butterflies taste with their feet."}, {"category": "Animals", "fact": "Sloths can slow their heart rate enough to hold their breath for up to 40 minutes."}, {"category": "Animals", "fact": "A shrimp's heart is located in its head."}, {"category": "Animals", "fact": "Axolotls can regrow limbs, and even parts of their heart and brain."}, {"category": "Body", "fact": "Your brain makes up about 2% of your body weight but uses around 20% of your energy."}, {"category": "Body", "fact": "Babies are born with roughly 300 bones. Adults have 206, because many fuse together."}, {"category": "Body", "fact": "Fingerprints start forming before birth, in the second trimester."}, {"category": "Body", "fact": "Your stomach replaces its inner lining every few days, so the acid doesn't digest you."}, {"category": "Body", "fact": "Your body has roughly 30 to 40 trillion human cells."}, {"category": "History", "fact": "Oxford University is older than the Aztec Empire. Teaching there began by 1096; Tenochtitlan was founded in 1325."}, {"category": "History", "fact": "Cleopatra lived closer in time to the Moon landing than to the building of the Great Pyramid."}, {"category": "History", "fact": "The shortest war in history, the Anglo-Zanzibar War of 1896, lasted roughly 40 minutes."}, {"category": "History", "fact": "Napoleon was about average height for a Frenchman of his time. The 'short' myth came from unit confusion and British cartoons."}, {"category": "History", "fact": "Archaeologists have found ancient honey in Egyptian tombs thousands of years old. Honey resists spoilage unusually well."}, {"category": "Science", "fact": "At the triple point, water can exist as ice, liquid, and vapor at the same time."}, {"category": "Science", "fact": "Sound travels about four times faster in water than in air."}, {"category": "Science", "fact": "Bananas are slightly g shows activity throughout the whole brain."}, {"category": "Psychology", "fact": "The peak-end rule: we judge an experience mostly by its most intense moment and how it ended, not by its average."}, {"category": "Psychology", "fact": "The mere-exposure effect: we tend to like things more simply because we've seen them before."}, {"category": "Psychology", "fact": "The 1964 Kitty Genovese story was exaggerated. Reports claimed 38 people watched and did nothing, but later reviews found that account inaccurate."}, {"category": "Psychology", "fact": "Hedonic adaptation: after big good or bad changes, most people drift back toward their usual level of happiness."}, {"category": "Psychology", "fact": "In a classic anchoring experiment, people's guesses about the UN's African members shifted depending on a random wheel spin they'd just seen."}, {"category": "Psychology", "fact": "During WWII, psychologist B. F. Skinner trained pigeons to guide missiles. The idea was never used in combat."}, {"category": "Economics", "fact": "Goodhart's law: once a measure becomes a target, it stops being a good measure."}, {"category": "Economics", "fact": "Zimbabwe printed a 100 trillion dollar banknote in 2009 during hyperinflation."}, {"category": "Economics", "fact": "The Dutch East India Company issued shares in 1602 and is often called the first publicly traded company."}, {"category": "Economics", "fact": "The Economist has published its lighthearted Big Mac Index since 1986 to compare currencies."}, {"category": "Economics", "fact": "On the island of Yap, people used giant stone discs called rai as money. Some were too heavy to move."}, {"category": "Economics", "fact": "The 'cobra effect' is named for a story in which a bounty on cobras led people to breed them for the reward."}, {"category": "Economics", "fact": "Historians now think 17th-century Dutch tulip mania was much smaller than the legend suggests."}, {"category": "Physics", "fact": "Around 100 trillion solar neutrinos pass through your body every second, almost never interacting with it."}, {"category": "Physics", "fact": "GPS satellites must correct for relativity. Without it, their clocks would drift by about 38 microseconds a day."}, {"category": "Physics", "fact": "Since 1983 the meter has been defined using the speed of light: 299,792,458 meters per second."}, {"category": "Physics", "fact": "Schrödinger's cat was a thought experiment meant to show how strange one quantum interpretation sounded, not an endorsement of it."}, {"category": "Physics", "fact": "Absolute zero is −273.15 °C, and nothing can be cooled all the way to it."}, {"category": "Physics", "fact": "Atoms are mostly empty space. You don't fall through your chair because of electromagnetic repulsion."}, {"category": "Physics", "fact": "The Eiffel Tower can grow about 15 cm taller in summer as its iron expands in the heat."}, {"category": "Math", "fact": "In a room of just 23 people, there's a better than 50% chance two share a birthday."}, {"category": "Math", "fact": "A shuffled deck of 52 cards has about 8 × 10^67 possible orders, so a well-shuffled deck is almost certainly in an order never seen before."}, {"category": "Math", "fact": "0.999… repeating forever is exactly equal to 1."}, {"category": "Math", "fact": "The word 'googol' (1 followed by 100 zeros) was coined by a nine-year-old, Milton Sirotta, in 1920."}, {"category": "Math", "fact": "The four color theorem, proved in 1976, was one of the first major proofs to rely on a computer."}, {"category": "Math", "fact": "Euler's identity, e^(iπ) + 1 = 0, links five of math's most important constants in one equation."}, {"category": "Math", "fact": "Graham's number is so huge that its digits wouldn't fit in the observable universe, even written as small as possible."}, {"category": "AI", "fact": "The term 'artificial intelligence' comes from a 1955 proposal for a workshop held at Dartmouth in 1956."}, {"category": "AI", "fact": "ELIZA, a 1960s chatbot by Joseph Weizenbaum, used simple pattern matching, yet some users felt it understood them."}, {"category": "AI", "fact": "In 1997, IBM's Deep Blue became the first computer to beat a reigning world chess champion, Garry Kasparov, in a match."}, {"category": "AI", "fact": "AlphaGo beat Go champion Lee Sedol 4–1 in 2016."}, {"category": "AI", "fact": "CAPTCHA stands for 'Completely Automated Public Turing test to tell Computers and Humans Apart'."}, {"category": "AI", "fact": "Alan Turing's 1950 paper called what we now call the Turing test 'the imitation game'."}, {"category": "Puns", "fact": "I used to hate facial hair, but then it grew on me."}, {"category": "Puns", "fact": "Time flies like an arrow; fruit flies like a banana."}, {"category": "Puns", "fact": "Why don't scientists trust atoms? They make up everything."}, {"category": "Puns", "fact": "I'm reading a book about anti-gravity. It's impossible to put down."}, {"category": "Puns", "fact": "A bicycle can't stand on its own because it's two-tired."}, {"category": "Puns", "fact": "I only know 25 letters of the alphabet. I don't know y."}, {"category": "Quotes", "fact": "'Not everything that counts can be counted' is often credited to Einstein, but it comes from sociologist William Bruce Cameron in 1963."}, {"category": "Quotes", "fact": "Sherlock Holmes never says 'Elementary, my dear Watson' in Conan Doyle's original stories."}, {"category": "Quotes", "fact": "Casablanca has no line 'Play it again, Sam'. The closest is 'Play it, Sam.'"}, {"category": "Quotes", "fact": "'Let them eat cake' is attributed to Marie Antoinette, but there's no evidence she said it. Rousseau wrote the phrase about an unnamed princess when she was still a child."}, {"category": "Quotes", "fact": "In The Empire Strikes Back, Vader says 'No, I am your father', not 'Luke, I am your father'."}, {"category": "Quotes", "fact": "Mark Twain's real line was closer to 'The report of my death was an exaggeration.'"}, {"category": "Quotes", "fact": "'I think, therefore I am' first appeared in French (Je pense, donc je suis) in 1637 before Descartes put it in Latin as 'Cogito, ergo sum'."}, {"category": "Music", "fact": "'Happy Birthday to You' was ruled free of copyright in the US in 2016 after a long legal fight."}, {"category": "Music", "fact": "John Cage's 4'33\" has no intentionally played notes. The 'music' is the sound of the room."}, {"category": "Music", "fact": "Beethoven composed his Ninth Symphony while almost completely deaf."}, {"category": "Music", "fact": "Tchaikovsky's 1812 Overture calls for cannon fire in the score."}, {"category": "Funny", "fact": "The Hundred Years' War lasted 116 years."}, {"category": "Funny", "fact": "During the Great Emu War of 1932, Australian soldiers with machine guns largely failed to cull the emus."}, {"category": "Funny", "fact": "There's a town called Boring in Oregon, and it's 'twinned' with Dull in Scotland."}, {"category": "Funny", "fact": "Nintendo was founded in 1889 as a playing-card company."}, {"category": "Funny", "fact": "The first item scanned at a store checkout with a barcode was a pack of Wrigley's gum, in 1974."}, {"category": "Funny", "fact": "The first webcam pointed at a coffee pot at the University of Cambridge so researchers could check whether it was full."}, {"category": "Funny", "fact": "Scotland's national animal is the unicorn."}, {"category": "Funny", "fact": "Goats have rectangular pupils."}, {"category": "Funny", "fact": "Pringles inventor Fredric Baur asked for some of his ashes to be buried in a Pringles can."}];
const COLORS={Space:"#a99bff",Nature:"#8be09f",Animals:"#ff8a65",Body:"#ff9a8b",History:"#f4c95d",Science:"#6fd3ff",Tech:"#ff9fd5",Food:"#ffb347",Language:"#c8b6ff",Earth:"#74e3c9",Psychology:"#ffd166",Economics:"#9be564",Physics:"#7ae7ff",Math:"#ffa8a8",AI:"#b8f2e6",Puns:"#ffe66d",Quotes:"#ffc2e2",Music:"#ff9770",Funny:"#caffbf",Mine:"#f9f871"};
const ICON={Space:"🪐",Nature:"🌿",Animals:"🐙",Body:"🧠",History:"🏛️",Science:"⚡",Tech:"💾",Food:"🍍",Language:"🔤",Earth:"🌍",Psychology:"🧩",Economics:"💸",Physics:"⚛️",Math:"🔢",AI:"🤖",Puns:"😜",Quotes:"💬",Music:"🎵",Funny:"🤡",Mine:"⭐",Random:"🎲"};
const store={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const hash=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return"f"+(h>>>0).toString(36)};
const rnd=()=>crypto.getRandomValues(new Uint32Array(1))[0]/4294967296;
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const $=id=>document.getElementById(id);
const bg=c=>COLORS[c]||`hsl(${[...c].reduce((h,x)=>(h*37+x.charCodeAt(0))%360,0)} 85% 74%)`;
let custom=store.get("custom",[]),picks=store.get("picks",[]),learn=store.get("learn",{}),FACTS=[];
let liked=new Set(store.get("liked",[])),saved=new Set(store.get("saved",[])),seen=store.get("seen",0),tab="all",shown=new Set();
const feed=$("feed"),count=$("count"),hint=$("hint"),sheet=$("sheet");
function build(){FACTS=[...BASE,...custom].map(f=>({category:f.category||"Mine",fact:f.fact}));FACTS.forEach(f=>f.id=hash(f.fact))}
build();

/* Feed algorithm: weighted random over facts not yet shown this cycle.
   weight = topic picks (4 vs 1) + learned taste (likes/saves/dwell), clamped.
   12% of picks ignore weights completely, so surprises never stop. */
const weight=c=>clamp((picks.length?(picks.includes(c)||c==="Mine"?4:1):1)+(learn[c]||0),.3,10);
const bump=(c,v)=>{learn[c]=clamp((learn[c]||0)+v,-2,4);store.set("learn",learn)};
const pool=()=>tab==="saved"?FACTS.filter(f=>saved.has(f.id)):FACTS;
function pick(){
  const all=pool();let av=all.filter(f=>!shown.has(f.id));
  if(!av.length){shown.clear();av=all}
  let f;
  if(rnd()<.12)f=av[Math.floor(rnd()*av.length)];
  else{
    const w=av.map(x=>weight(x.category));let r=rnd()*w.reduce((a,b)=>a+b,0);
    for(let i=0;i<av.length;i++){r-=w[i];if(r<0){f=av[i];break}}
    f=f||av[av.length-1];
  }
  shown.add(f.id);return f;
}

function card(f){
  const el=document.createElement("section");
  el.className="card";el.dataset.id=f.id;el.dataset.cat=f.category;el.style.background=bg(f.category);
  el.innerHTML=`<div class="deco">${ICON[f.category]||"✨"}</div><div class="cat"></div><p class="fact"></p>
  <div class="rail"><div><button data-act="like" aria-label="Like">♥</button></div><div><button data-act="save" aria-label="Save">★</button></div><div><button data-act="share" aria-label="Share">↗</button></div></div>`;
  el.querySelector(".cat").textContent=f.category;
  el.querySelector(".fact").textContent=f.fact;
  sync(el);io.observe(el);return el;
}
function sync(el){
  el.querySelector("[data-act=like]").classList.toggle("on",liked.has(el.dataset.id));
  el.querySelector("[data-act=save]").classList.toggle("on",saved.has(el.dataset.id));
}
function more(n=6){
  if(!pool().length){feed.innerHTML='<div class="empty">Nothing saved yet. Tap ★ on a fact to keep it.</div>';return}
  for(let i=0;i<n;i++)feed.append(card(pick()));
}
function refresh(first){
  feed.innerHTML="";shown.clear();
  if(first){shown.add(first.id);feed.append(card(first))}
  more(6);feed.scrollTop=0;
}
const showCount=()=>count.textContent=seen+" learned";
const persist=()=>{store.set("liked",[...liked]);store.set("saved",[...saved])};

const io=new IntersectionObserver(es=>es.forEach(e=>{
  const el=e.target;
  if(!e.isIntersecting){
    if(el.dataset.t){const ms=Date.now()-el.dataset.t;delete el.dataset.t;bump(el.dataset.cat,ms<1200?-.15:ms>4500?.1:0)}
    return;
  }
  el.dataset.t=Date.now();
  if(!el.dataset.seen){el.dataset.seen=1;seen++;store.set("seen",seen);showCount();if(seen>1)hint.style.display="none"}
  if(feed.children.length-[...feed.children].indexOf(el)<=3)more(4);
}),{root:feed,threshold:.6});

function like(el,x,y){
  if(!liked.has(el.dataset.id)){liked.add(el.dataset.id);bump(el.dataset.cat,.5);persist();sync(el)}
  const b=document.createElement("div");b.className="burst";b.textContent="♥";
  const r=el.getBoundingClientRect();b.style.left=x-r.left+"px";b.style.top=y-r.top+"px";
  el.append(b);setTimeout(()=>b.remove(),750);
}
let lastTap=0;
feed.addEventListener("click",async e=>{
  const el=e.target.closest(".card");if(!el)return;
  const btn=e.target.closest("button");
  if(btn){
    const id=el.dataset.id,act=btn.dataset.act,c=el.dataset.cat;
    if(act==="like"){liked.has(id)?liked.delete(id):(liked.add(id),bump(c,.5));persist();sync(el)}
    if(act==="save"){saved.has(id)?saved.delete(id):(saved.add(id),bump(c,.8));persist();sync(el)}
    if(act==="share"){
      const text=el.querySelector(".fact").textContent+"\n— FactScroll";
      try{navigator.share?await navigator.share({text}):await navigator.clipboard.writeText(text)}catch(_){}
    }
    return;
  }
  const t=Date.now();if(t-lastTap<320)like(el,e.clientX,e.clientY);lastTap=t;
});
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{
  tab=b.dataset.tab;
  document.querySelectorAll(".tabs button").forEach(x=>x.setAttribute("aria-selected",x===b));
  refresh();
});

/* Topic picker */
let sel=new Set();
function drawChips(){
  sel=new Set(picks);const box=$("chips");box.innerHTML="";
  [...new Set(FACTS.map(f=>f.category))].sort().forEach(c=>{
    const b=document.createElement("button");b.textContent=(ICON[c]||"✨")+" "+c;b.className=sel.has(c)?"on":"";
    b.onclick=()=>{sel.has(c)?sel.delete(c):sel.add(c);b.classList.toggle("on")};box.append(b);
  });
}
function openSheet(n){sheet.hidden=false;$("sTopics").hidden=n!=="t";$("sAdd").hidden=n!=="a";$("addMsg").textContent="";if(n==="t")drawChips()}
function closeSheet(){sheet.hidden=true;store.set("onboarded",1)}
$("bTopics").onclick=()=>openSheet("t");$("bAdd").onclick=()=>openSheet("a");$("close").onclick=closeSheet;
sheet.onclick=e=>{if(e.target===sheet)closeSheet()};
$("topicsClear").onclick=()=>{sel.clear();document.querySelectorAll("#chips button").forEach(b=>b.classList.remove("on"))};
$("topicsSave").onclick=()=>{picks=[...sel];learn={};store.set("picks",picks);store.set("learn",learn);closeSheet();refresh()};

/* User-added facts: one per line, or a JSON list of strings / {category, fact} */
function parseFacts(t){
  try{const j=JSON.parse(t);if(Array.isArray(j))return j.map(x=>typeof x==="string"?{fact:x}:x).filter(x=>x&&typeof x.fact==="string")}catch(e){}
  return t.split(/\n+/).map(s=>({fact:s}));
}
function addFacts(items){
  const have=new Set(FACTS.map(f=>f.id));let n=0,first;
  items.forEach(x=>{
    const t=String(x.fact).trim().slice(0,280);if(t.length<3||have.has(hash(t)))return;
    const c=String(x.category||$("newCat").value||"Mine").trim().slice(0,24)||"Mine";
    custom.push({category:c,fact:t});have.add(hash(t));n++;first=first||{category:c,fact:t,id:hash(t)};
  });
  store.set("custom",custom);build();
  $("addMsg").textContent=n?`Added ${n}.`:"Nothing new to add.";
  if(n){$("newFacts").value="";closeSheet();refresh(first)}
}
$("addSave").onclick=()=>addFacts(parseFacts($("newFacts").value));
$("file").onchange=async e=>{const t=await e.target.files[0]?.text();if(t)addFacts(parseFacts(t));e.target.value=""};
$("clearMine").onclick=()=>{custom=[];store.set("custom",custom);build();closeSheet();refresh()};

addEventListener("keydown",e=>{
  if(e.key==="Escape")closeSheet();
  if(!sheet.hidden)return;
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();feed.scrollBy({top:(e.key==="ArrowDown"?1:-1)*feed.clientHeight,behavior:"smooth"})}
});
showCount();more(6);
if(!store.get("onboarded")&&!picks.length)openSheet("t");
</script>
